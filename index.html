          href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap"></noscript>

    <script>
        /* Sprach-Init vor dem ersten Paint — verhindert RTL/LTR-Flackern */
        (function () {
            try {
                var p = new URLSearchParams(location.search).get('lang');
                var s = p || localStorage.getItem('lang');
                if (s === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
                if (p === 'en' || p === 'ar') localStorage.setItem('lang', p);
            } catch (e) { }
        })();
    </script>

    <style>
        :root {
            --sky:          #D8ECFA;
            --accent:       #2E7CD6;
            --ink:          #12365C;
            --ink-soft:     #4A6B8F; /* AA-sicher auf Glas über hellen Wolken */
            --glass:        rgba(255,255,255,0.62);
            --glass-border: rgba(255,255,255,0.95);
            --badge:        #12365C;
            --whatsapp:     #25D366;
            --accent-text:  #1D5FAE; /* dunklerer Akzent nur fuer Text auf hellen Flaechen (AA) */
            --fd: 'Alexandria', 'IBM Plex Sans Arabic', sans-serif;
            --fb: 'IBM Plex Sans Arabic', 'Alexandria', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            scroll-snap-type: y proximity;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--fb);
            background: var(--sky);
            color: var(--ink);
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: clip;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        ::selection { background: rgba(46, 124, 214, 0.25); }

        a { color: inherit; }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 9px;
        }

        /* ---------- Sky layers ---------- */
        .sky-fallback {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: var(--sky) url('assets/sky-poster.jpg') center / cover no-repeat;
        }

        .sky-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .sky-bg.ready { opacity: 1; }

        /* ---------- Glass primitives ---------- */
        .glass {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
        }

        /* leichte Fläche ohne Blur — Perf-Regel: max ~3 geblurte Flächen im Viewport */
        .lite {
            background: rgba(255, 255, 255, 0.66);
            border: 1px solid var(--glass-border);
        }

        /* ---------- Page column ---------- */
        .page {
            max-width: 480px;
            margin-inline: auto;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- Header ---------- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 9px 14px;
            border-left: 0;
            border-right: 0;
            border-top: 0;
            border-radius: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .mono {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.72);
            border: 1.5px solid var(--accent);
            font-family: var(--fd);
            font-weight: 600;
            font-size: 15px;
            color: var(--accent-text);
        }

        .brand-name {
            font-family: var(--fd);
            font-weight: 500;
            font-size: 14px;
            color: var(--ink);
        }

        .lang-toggle {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 3px;
            border-radius: 9px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.55);
            font-family: var(--fb);
            cursor: pointer;
        }

        .lang-toggle span {
            padding: 4px 10px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 500;
            color: var(--ink-soft);
            line-height: 1.4;
        }

        .lang-toggle span.on {
            background: var(--accent-text);
            color: #fff;
        }

        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
            border: 0;
        }

        /* ---------- Hero ---------- */
        .hero {
            min-height: 45vh;
            min-height: 45svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 14px;
            padding: 34px 24px 18px;
        }

        h1 {
            font-family: var(--fd);
            font-weight: 600;
            font-size: clamp(30px, 8.5vw, 38px);
            line-height: 1.25;
            color: var(--ink);
        }

        .hero-sub {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.8;
            color: var(--ink);
            max-width: 320px;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 2px;
        }

        .stat-chip {
            padding: 7px 14px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 500;
            color: var(--ink);
            white-space: nowrap;
        }

        .hero-chev {
            margin-top: 14px;
            color: var(--ink-soft);
            display: inline-flex;
            padding: 6px;
        }

        .hero-chev svg { width: 24px; height: 24px; }

        /* ---------- Featured feed ---------- */
        .feed-card {
            min-height: 100vh;
            min-height: 100svh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: start;
            padding: 72px 20px 92px;
        }

        .glass-card {
            width: 100%;
            max-width: 350px;
            padding: 26px 22px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 18px 40px rgba(18, 54, 92, 0.12);
        }

        .logo-tile {
            width: 84px;
            height: 84px;
            border-radius: 20px;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 22px rgba(18, 54, 92, 0.10);
            overflow: hidden;
        }

        .logo-tile img {
            width: 68px;
            height: 68px;
            border-radius: 15px;
            object-fit: cover;
            display: block;
        }

        .logo-tile.pad img {
            object-fit: contain;
            border-radius: 0;
        }

        .logo-fallback {
            font-family: var(--fd);
            font-weight: 600;
            font-size: 30px;
            color: var(--accent);
        }

        .p-name {
            margin-top: 14px;
            font-family: var(--fd);
            font-weight: 500;
            font-size: 20px;
            line-height: 1.35;
            color: var(--ink);
        }

        .feat-label {
            margin-top: 5px;
            font-size: 12px;
            font-weight: 500;
            color: var(--accent-text);
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 7px;
            margin-top: 11px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 12px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 500;
            color: var(--ink);
        }

        .chip img {
            width: 22px;
            height: 22px;
            display: block;
            object-fit: contain;
        }

        .c-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--glass-border);
            display: inline-block;
        }

        .chip.stat {
            background: rgba(46, 124, 214, 0.12);
            border: 1px solid rgba(46, 124, 214, 0.30);
            color: var(--accent-text);
        }

        .story {
            margin-top: 13px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--ink-soft);
            max-width: 290px;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 17px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 13px;
            border-radius: 9px;
            background: var(--badge);
            color: #fff;
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        .badge svg { width: 14px; height: 14px; flex: 0 0 14px; }

        .badge:active { transform: scale(0.97); }

        .plat-chip {
            padding: 8px 14px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 500;
            color: var(--ink);
        }

        .swipe-hint {
            position: absolute;
            bottom: 26px;
            inset-inline: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--ink);
            font-size: 11px;
            font-weight: 500;
            opacity: 0.82;
            pointer-events: none;
        }

        .swipe-hint svg {
            width: 18px;
            height: 18px;
            animation: hint-float 1.6s ease-in-out infinite;
        }

        @keyframes hint-float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        /* ---------- All-projects grid ---------- */
        .all {
            padding: 44px 20px 6px;
        }

        .sec-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 16px;
            padding-inline: 2px;
        }

        .sec-head h2 {
            font-family: var(--fd);
            font-weight: 600;
            font-size: 20px;
            color: var(--ink);
        }

        .count {
            padding: 5px 12px;
            border-radius: 9px;
            background: rgba(46, 124, 214, 0.12);
            border: 1px solid rgba(46, 124, 214, 0.30);
            color: var(--accent-text);
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 6px;
            padding: 13px 6px 11px;
            border-radius: 18px;
            text-decoration: none;
            transition: transform 0.15s ease;
        }

        .tile:active { transform: scale(0.97); }

        .tile img {
            width: 44px;
            height: 44px;
            border-radius: 11px;
            object-fit: cover;
            display: block;
        }

        .tile.pad img { object-fit: contain; border-radius: 0; }

        .t-name {
            font-size: 12px;
            font-weight: 500;
            color: var(--ink);
            line-height: 1.3;
        }

        .t-country {
            font-size: 11px;
            color: var(--ink-soft);
            line-height: 1;
        }

        .grid:not(.expanded) .tile:nth-child(n+10) { display: none; }

        .more {
            display: block;
            margin: 16px auto 0;
            padding: 10px 24px;
            border-radius: 9px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.66);
            font-family: var(--fb);
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            cursor: pointer;
        }

        .more:active { transform: scale(0.97); }

        .grid.expanded + .more { display: none; }

        /* ---------- CTA ---------- */
        .cta-wrap {
            padding: 48px 20px 10px;
            display: flex;
            justify-content: center;
        }

        .cta {
            padding: 30px 24px 24px;
        }

        .cta h2 {
            font-family: var(--fd);
            font-weight: 600;
            font-size: 22px;
            color: var(--ink);
        }

        .cta-sub {
            margin-top: 8px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--ink-soft);
        }

        .wa-btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-top: 18px;
            padding: 13px 26px;
            border-radius: 9px;
            background: var(--whatsapp);
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 10px 24px rgba(37, 211, 102, 0.30);
        }

        .wa-btn:active { transform: scale(0.97); }

        .wa-btn svg { width: 18px; height: 18px; }

        .reply {
            margin-top: 11px;
            font-size: 11px;
            color: var(--ink-soft);
        }

        /* ---------- Footer ---------- */
        footer {
            margin-top: auto;
            padding: 30px 20px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
            color: var(--ink);
        }

        footer a {
            display: inline-flex;
            padding: 4px;
            color: var(--ink);
            text-decoration: none;
        }

        footer svg { width: 17px; height: 17px; }

        .dot-sep { opacity: 0.45; }

        /* ---------- Motion ---------- */
        .reveal {
            opacity: 0;
            transform: translateY(14px);
        }

        .reveal.in {
            opacity: 1;
            transform: none;
            transition: opacity 0.45s ease-out, transform 0.45s ease-out;
        }

        /* ---------- Desktop: Telefon-Spalte, Himmel full-bleed ---------- */
        @media (min-width: 520px) {
            .topbar {
                margin: 10px 10px 0;
                border-radius: 14px;
                border: 1px solid var(--glass-border);
            }
        }

        /* ---------- Reduced motion ---------- */
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .sky-bg { display: none; }
            .swipe-hint svg { animation: none; }
            .reveal { opacity: 1; transform: none; transition: none; }
            .sky-bg, .tile, .more, .badge, .wa-btn { transition: none; }
        }
    </style>
</head>

        function storeBadges(links) {

        }

        function platformChips() {
            return t('platforms').map(x => '<span class="plat-chip lite">' + x + '</span>').join('');

        function hookImgFallbacks(scope) {
            /* Länder-Icons: fehlt die Datei, ersetzt ein neutraler Glas-Kreis das Bild (nie eine Emoji-Flagge) */
            scope.querySelectorAll('img.cicon').forEach(img => {
                const swap = () => {
                    const dot = document.createElement('span');
                    dot.className = 'c-dot';
                    dot.setAttribute('aria-hidden', 'true');
                    img.replaceWith(dot);
                };
                if (img.complete && img.naturalWidth === 0) swap();
                else img.addEventListener('error', swap, { once: true });
            });
            /* Projekt-Logos: fehlt die Datei, zeigt die Kachel den Anfangsbuchstaben */
            scope.querySelectorAll('img.plogo').forEach(img => {
                const swap = () => {
                    const span = document.createElement('span');
                    span.className = 'logo-fallback';
                    span.textContent = img.dataset.mono || '·';
                    img.replaceWith(span);
                };
                if (img.complete && img.naturalWidth === 0) swap();
                else img.addEventListener('error', swap, { once: true });
            });
        }

                        '</div>' +
                        '<p class="story">' + p.story[lang] + '</p>' +
                        '<div class="badges">' + (hasLinks ? storeBadges(p.links) : platformChips()) + '</div>' +

                    (!last ? '<div class="swipe-hint" aria-hidden="true"><svg><use href="#i-up"/></svg><span>' + t('swipe') + '</span></div>' : '') +
                '</article>';
            }).join('');
            hookImgFallbacks(feed);
            if (booted) feed.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
            else observeReveals(feed);
        }

            grid.innerHTML = items.map(p => {
                const href = p.links.ios || p.links.android || p.links.web;
                const label = esc(p.name[lang]) + ' — ' + I18N[lang].countries[p.country];
                const inner = '<img class="plogo" src="' + p.logo + '" data-mono="' + esc(p.name.en.charAt(0)) + '" alt="" width="44" height="44" loading="lazy">' +
                    '<span class="t-name">' + esc(p.name[lang]) + '</span>' +
                    '<span class="t-country">' + I18N[lang].countries[p.country] + '</span>';
                const cls = 'tile lite' + (p.pad ? ' pad' : '');
                /* Projekte ohne erreichbare URL werden als Nicht-Link-Kachel gerendert */
                return href
                    ? '<a class="' + cls + '" href="' + href + '" target="_blank" rel="noopener" aria-label="' + label + '">' + inner + '</a>'
                    : '<div class="' + cls + '">' + inner + '</div>';
            }).join('');
            hookImgFallbacks(grid);
        }

        function applyStatics() {
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
            $('#monoTile').textContent = t('mono');
            $('#waBtn').href = 'https://wa.me/213676085441?text=' + encodeURIComponent(t('waMsg'));
            document.querySelectorAll('.lang-toggle span').forEach(s => s.classList.toggle('on', s.dataset.l === lang));
        }

        function applyLang() {
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            try { localStorage.setItem('lang', lang); } catch (e) { }
            applyStatics();
            renderFeed();
            renderGrid();
        }

        /* ================= Reveal-Animation ================= */
        let io = null;

        function observeReveals(scope) {
            if (!io) { scope.querySelectorAll('.reveal').forEach(el => el.classList.add('in')); return; }
            scope.querySelectorAll('.reveal:not(.in)').forEach(el => io.observe(el));
        }

        if ('IntersectionObserver' in window) {
            io = new IntersectionObserver(entries => {
                entries.forEach(e => {
                    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
                });
            }, { threshold: 0.15 });
        }

        /* ================= Boot ================= */
        applyStatics();
        renderFeed();
        renderGrid();
        observeReveals(document);
        booted = true;

        /* Deep-Links (#projects, #contact): erneut scrollen, nachdem der Feed gerendert wurde */
        if (location.hash) {
            requestAnimationFrame(() => {
                const target = document.querySelector(location.hash);
                if (target) target.scrollIntoView();
            });
        }

        $('#langToggle').addEventListener('click', () => {
            lang = lang === 'ar' ? 'en' : 'ar';
            applyLang();
        });

        $('#moreBtn').addEventListener('click', () => {
            $('#grid').classList.add('expanded');
        });

        /* ================= Sky-Video ================= */
        (function () {
            const sky = document.getElementById('sky');
            if (!sky) return;
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                sky.remove(); /* Poster (.sky-fallback) bleibt als fester Hintergrund */
                return;
            }
            const kill = () => { if (sky.parentNode) sky.remove(); };
            sky.addEventListener('error', kill);
            const srcEl = sky.querySelector('source');
            if (srcEl) srcEl.addEventListener('error', kill);

            sky.addEventListener('playing', () => sky.classList.add('ready'));

            document.addEventListener('visibilitychange', () => {
                if (!sky.parentNode) return;
                if (document.hidden) sky.pause();
                else sky.play().catch(() => { });
            });

            /* iOS-Energiesparmodus: Autoplay blockiert → beim ersten Touch erneut versuchen */
            const tryPlay = () => { sky.play().catch(() => { }); };
            window.addEventListener('touchstart', tryPlay, { once: true, passive: true });
            window.addEventListener('click', tryPlay, { once: true });
        })();
    </script>
</body>
</html>
