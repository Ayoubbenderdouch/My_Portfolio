<html lang="en" dir="ltr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ayoub Benderdouch — Apps & Platforms</title>
    <meta name="description" content="30 real products on the App Store and Google Play — apps and platforms by one developer.">
    <meta name="theme-color" content="#D8ECFA">
    <link rel="canonical" href="https://ayoubportfolio.site/">
    <meta property="og:title" content="Ayoub Benderdouch — Apps & Platforms">
    <meta property="og:description" content="30 real products on the App Store and Google Play — apps and platforms by one developer.">
    <meta property="og:url" content="https://ayoubportfolio.site/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://ayoubportfolio.site/assets/sky-poster.jpg">

    <link rel="preload" as="image" href="assets/sky-poster.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap"></noscript>

    <style>
        :root {
            --sky:          #D8ECFA;
            --accent:       #2E7CD6;
            --ink:          #12365C;
            --ink-soft:     #4A6B8F; /* AA-safe on glass over bright clouds */
            --glass:        rgba(255,255,255,0.62);
            --glass-border: rgba(255,255,255,0.95);
            --badge:        #12365C;
            --whatsapp:     #25D366;
            --accent-text:  #1D5FAE; /* darker accent for text on light surfaces (AA) */
            --fd: 'Alexandria', 'IBM Plex Sans Arabic', sans-serif;
            --fb: 'IBM Plex Sans Arabic', 'Alexandria', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--fb);
            background: var(--sky);
            color: var(--ink);
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: clip;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        ::selection { background: rgba(46, 124, 214, 0.25); }

        a { color: inherit; }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 9px;
        }

        /* ---------- Sky layers ---------- */
        .sky-fallback {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: var(--sky) url('assets/sky-poster.jpg') center / cover no-repeat;
        }

        .sky-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .sky-bg.ready { opacity: 1; }

        /* ---------- Glass primitives ---------- */
        .glass {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
        }

        .lite {
            background: rgba(255, 255, 255, 0.66);
            border: 1px solid var(--glass-border);
        }

        /* ---------- Page column ---------- */
        .page {
            max-width: 480px;
            margin-inline: auto;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- Hero ---------- */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 18px;
            padding: 54px 24px 8px;
        }

        h1 {
            font-family: var(--fd);
            font-weight: 600;
            font-size: clamp(30px, 8.5vw, 38px);
            line-height: 1.2;
            color: var(--ink);
        }

        /* Zwei klare Sektions-Buttons: Apps / Websites */
        .nav-btns {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 350px;
        }

        .nav-card {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 15px 10px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 26px rgba(18, 54, 92, 0.10);
            text-decoration: none;
            font-family: var(--fd);
            font-weight: 600;
            font-size: 15px;
            color: var(--ink);
            transition: transform 0.15s ease;
        }

        .nav-card:active { transform: scale(0.97); }

        .nav-card svg {
            width: 18px;
            height: 18px;
            color: var(--accent-text);
            flex: 0 0 18px;
        }

        .nav-count {
            padding: 2px 8px;
            border-radius: 9px;
            background: rgba(46, 124, 214, 0.12);
            border: 1px solid rgba(46, 124, 214, 0.30);
            color: var(--accent-text);
            font-family: var(--fb);
            font-size: 11px;
            font-weight: 500;
            line-height: 1.5;
        }

        /* ---------- Sections ---------- */
        .sect {
            padding: 30px 20px 0;
            scroll-margin-top: 12px;
        }

        .sec-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
            padding-inline: 2px;
        }

        .sec-head h2 {
            font-family: var(--fd);
            font-weight: 600;
            font-size: 20px;
            color: var(--ink);
        }

        .count {
            padding: 5px 12px;
            border-radius: 9px;
            background: rgba(46, 124, 214, 0.12);
            border: 1px solid rgba(46, 124, 214, 0.30);
            color: var(--accent-text);
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        /* ---------- Cards (alle Projekte gleich groß) ---------- */
        .cards {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .glass-card {
            width: 100%;
            max-width: 350px;
            padding: 24px 22px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 18px 40px rgba(18, 54, 92, 0.12);
        }

        .logo-tile {
            width: 84px;
            height: 84px;
            border-radius: 20px;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 22px rgba(18, 54, 92, 0.10);
            overflow: hidden;
        }

        .logo-tile img {
            width: 68px;
            height: 68px;
            border-radius: 15px;
            object-fit: cover;
            display: block;
        }

        .logo-tile.pad img {
            object-fit: contain;
            border-radius: 0;
        }

        .logo-fallback {
            font-family: var(--fd);
            font-weight: 600;
            font-size: 30px;
            color: var(--accent);
        }

        .p-name {
            margin-top: 13px;
            font-family: var(--fd);
            font-weight: 500;
            font-size: 20px;
            line-height: 1.3;
            color: var(--ink);
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 7px;
            margin-top: 10px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 12px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 500;
            color: var(--ink);
        }

        .chip img {
            width: 22px;
            height: 22px;
            display: block;
            object-fit: contain;
        }

        .c-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--glass-border);
            display: inline-block;
        }

        .chip.stat {
            background: rgba(46, 124, 214, 0.12);
            border: 1px solid rgba(46, 124, 214, 0.30);
            color: var(--accent-text);
        }

        .story {
            margin-top: 12px;
            font-size: 13px;
            line-height: 1.65;
            color: var(--ink-soft);
            max-width: 290px;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 13px;
            border-radius: 9px;
            background: var(--badge);
            color: #fff;
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        .badge svg { width: 14px; height: 14px; flex: 0 0 14px; }

        .badge:active { transform: scale(0.97); }

        /* Out of service: kein Link, gedaempftes Glas-Pill statt dunklem Badge */
        .badge.dead {
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid var(--glass-border);
            color: var(--ink-soft);
        }

        .glass-card.offline .logo-tile img,
        .glass-card.offline .logo-fallback {
            filter: grayscale(0.85);
            opacity: 0.72;
        }

        /* ---------- CTA ---------- */
        .cta-wrap {
            padding: 36px 20px 10px;
            display: flex;
            justify-content: center;
        }

        .cta {
            padding: 28px 24px 22px;
        }

        .cta h2 {
            font-family: var(--fd);
            font-weight: 600;
            font-size: 22px;
            color: var(--ink);
        }

        .cta-sub {
            margin-top: 8px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--ink-soft);
        }

        .wa-btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-top: 16px;
            padding: 13px 26px;
            border-radius: 9px;
            background: var(--whatsapp);
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 10px 24px rgba(37, 211, 102, 0.30);
        }

        .wa-btn:active { transform: scale(0.97); }

        .wa-btn svg { width: 18px; height: 18px; }

        .reply {
            margin-top: 10px;
            font-size: 11px;
            color: var(--ink-soft);
        }

        /* ---------- Floating WhatsApp (bleibt beim Scrollen stehen) ----------
           right: an der rechten Kante der 480px-Spalte ausgerichtet, nie naeher
           als 16px am Viewport-Rand (schmale Screens). */
        .wa-fab {
            position: fixed;
            z-index: 20;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            right: max(16px, calc(50vw - 224px));
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--whatsapp);
            color: #fff;
            box-shadow: 0 10px 26px rgba(37, 211, 102, 0.38), 0 2px 8px rgba(18, 54, 92, 0.18);
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px) scale(0.85);
            transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.34, 1.28, 0.64, 1), visibility 0.28s;
        }

        .wa-fab.show {
            opacity: 1;
            visibility: visible;
            transform: none;
        }

        .wa-fab svg { width: 27px; height: 27px; }

        .wa-fab.show:active { transform: scale(0.93); }

        /* ---------- Footer ---------- */
        footer {
            margin-top: auto;
            padding: 28px 20px 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
            color: var(--ink);
        }

        footer a {
            display: inline-flex;
            padding: 4px;
            color: var(--ink);
            text-decoration: none;
        }

        footer svg { width: 17px; height: 17px; }

        .dot-sep { opacity: 0.45; }

        /* ---------- Motion ---------- */
        .reveal {
            opacity: 0;
            transform: translateY(14px);
        }

        .reveal.in {
            opacity: 1;
            transform: none;
            transition: opacity 0.45s ease-out, transform 0.45s ease-out;
        }

        /* ---------- Reduced motion ---------- */
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .sky-bg { display: none; }
            .reveal { opacity: 1; transform: none; transition: none; }
            .sky-bg, .badge, .wa-btn, .nav-card { transition: none; }
            .wa-fab { transition: none; transform: none; }
        }
    </style>
</head>

        /* ================= Helpers ================= */
        const $ = s => document.querySelector(s);

        function esc(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function countryChip(p) {
            return '<span class="chip country lite">' +
                '<img class="cicon" src="assets/countries/' + p.country + '.png" alt="" width="22" height="22" loading="lazy">' +
                '<span>' + COUNTRIES[p.country] + '</span></span>';
        }

        function storeBadges(p) {
            /* App-Karten: nur Stores. Website-Links leben ausschliesslich in der Websites-Sektion. */
            const links = p.links, b = [];
            if (p.offline) {
                return '<span class="badge dead"><svg aria-hidden="true"><use href="#i-off"/></svg>Out of service</span>';
            }
            if (p.kind === 'app') {
                if (links.ios) b.push('<a class="badge" href="' + links.ios + '" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-apple"/></svg>App Store</a>');
                if (links.android) b.push('<a class="badge" href="' + links.android + '" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-play"/></svg>Google Play</a>');
                if (links.gallery) b.push('<a class="badge" href="' + links.gallery + '" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-huawei"/></svg>AppGallery</a>');
            } else if (links.web) {
                b.push('<a class="badge" href="' + links.web + '" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-globe"/></svg>Website</a>');
            }
            return b.join('');
        }

        function hookImgFallbacks(scope) {
            /* Country icons: if the file is missing, a neutral glass circle replaces the image (never an emoji flag) */
            scope.querySelectorAll('img.cicon').forEach(img => {
                const swap = () => {
                    const dot = document.createElement('span');
                    dot.className = 'c-dot';
                    dot.setAttribute('aria-hidden', 'true');
                    img.replaceWith(dot);
                };
                if (img.complete && img.naturalWidth === 0) swap();
                else img.addEventListener('error', swap, { once: true });
            });
            /* Project logos: if the file is missing, the tile shows the initial letter */
            scope.querySelectorAll('img.plogo').forEach(img => {
                const swap = () => {
                    const span = document.createElement('span');
                    span.className = 'logo-fallback';
                    span.textContent = img.dataset.mono || '·';
                    img.replaceWith(span);
                };
                if (img.complete && img.naturalWidth === 0) swap();
                else img.addEventListener('error', swap, { once: true });
            });
        }

        /* ================= Render ================= */
        function card(p, lazy) {
            const badges = storeBadges(p);
            return '<article class="glass-card glass reveal' + (p.offline ? ' offline' : '') + '" aria-label="' + esc(p.name) + '">' +
                '<div class="logo-tile' + (p.pad ? ' pad' : '') + '">' +
                    '<img class="plogo" src="' + p.logo + '" data-mono="' + esc(p.name.charAt(0)) + '" alt="" width="68" height="68"' + (lazy ? ' loading="lazy"' : '') + '>' +
                '</div>' +
                '<h3 class="p-name">' + esc(p.name) + '</h3>' +
                '<div class="chips">' + countryChip(p) +
                    (p.stat ? '<span class="chip stat">' + p.stat + '</span>' : '') +
                '</div>' +
                (p.story ? '<p class="story">' + p.story + '</p>' : '') +
                (badges ? '<div class="badges">' + badges + '</div>' : '') +
            '</article>';
        }

        function renderKind(kind, cardsSel, countSel, navSel, word) {
            const all = PROJECTS.filter(p => p.kind === kind).sort((a, b) => a.order - b.order);
            $(cardsSel).innerHTML = all.map((p, i) => card(p, kind !== 'app' || i > 0)).join('');
            $(countSel).textContent = all.length + ' ' + word;
            $(navSel).textContent = all.length;
            hookImgFallbacks($(cardsSel));
            observeReveals($(cardsSel));
        }

        /* ================= Reveal animation ================= */
        let io = null;

        if ('IntersectionObserver' in window) {
            io = new IntersectionObserver(entries => {
                entries.forEach(e => {
                    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
                });
            }, { threshold: 0.15 });
        }

        function observeReveals(scope) {
            if (!io) { scope.querySelectorAll('.reveal').forEach(el => el.classList.add('in')); return; }
            scope.querySelectorAll('.reveal:not(.in)').forEach(el => io.observe(el));
        }

        /* ================= Floating WhatsApp =================
           Erscheint nach dem Hero und blendet sich aus, sobald der grosse
           CTA-Button sichtbar ist — nie zwei gruene Buttons gleichzeitig. */
        function initWaFab() {
            const fab = $('#waFab'), cta = $('#contact');
            let ctaVisible = false, queued = false;

            const sync = () => {
                queued = false;
                fab.classList.toggle('show', window.scrollY > 260 && !ctaVisible);
            };

            if ('IntersectionObserver' in window && cta) {
                new IntersectionObserver(entries => {
                    ctaVisible = entries[0].isIntersecting;
                    sync();
                }, { threshold: 0 }).observe(cta);
            }

            window.addEventListener('scroll', () => {
                if (queued) return;
                queued = true;
                requestAnimationFrame(sync);
            }, { passive: true });

            sync();
        }

        /* ================= Boot ================= */
        const WA_HREF = 'https://wa.me/213676085441?text=' + encodeURIComponent(WA_MSG);
        $('#waBtn').href = WA_HREF;
        $('#waFab').href = WA_HREF;
        initWaFab();
        renderKind('app', '#appsCards', '#appsCount', '#navAppsCount', 'apps');
        renderKind('web', '#webCards', '#webCount', '#navWebCount', 'websites');
        observeReveals(document);

        /* Deep links (#apps, #websites, #contact): re-scroll after render */
        if (location.hash) {
            requestAnimationFrame(() => {
                const target = document.querySelector(location.hash);
                if (target) target.scrollIntoView();
            });
        }

        /* ================= Sky video ================= */
        (function () {
            const sky = document.getElementById('sky');
            if (!sky) return;
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                sky.remove(); /* poster (.sky-fallback) stays as the fixed background */
                return;
            }
            const kill = () => { if (sky.parentNode) sky.remove(); };
            sky.addEventListener('error', kill);
            const srcEl = sky.querySelector('source');
            if (srcEl) srcEl.addEventListener('error', kill);

            sky.addEventListener('playing', () => sky.classList.add('ready'));

            document.addEventListener('visibilitychange', () => {
                if (!sky.parentNode) return;
                if (document.hidden) sky.pause();
                else sky.play().catch(() => { });
            });

            /* iOS Low Power Mode blocks autoplay — retry on first touch */
            const tryPlay = () => { sky.play().catch(() => { }); };
            window.addEventListener('touchstart', tryPlay, { once: true, passive: true });
            window.addEventListener('click', tryPlay, { once: true });
        })();
